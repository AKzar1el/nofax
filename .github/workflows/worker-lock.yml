name: Worker lockfile

on:
  push:
    branches: [feat/v0.3-remote-mcp-worker]
    paths:
      - worker/package.json
      - .github/workflows/worker-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-remote-mcp-worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - name: Generate lockfile
        working-directory: worker
        run: npm install --package-lock-only
      - name: Commit lockfile when changed
        run: |
          if [ -z "$(git status --porcelain -- worker/package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/package-lock.json
          git commit -m "chore: lock remote worker dependencies"
          git push origin HEAD:feat/v0.3-remote-mcp-worker
