name: Read-only MCP qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Start local Worker
        shell: bash
        run: |
          set -euo pipefail
          cat > .dev.vars <<'EOF'
          NOFAX_REMOTE_KEY="readonly-ci-key-abcdefghijklmnopqrstuvwxyz123456"
          EOF
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/nofax-wrangler.log 2>&1 &
          echo $! > /tmp/nofax-wrangler.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nofax-wrangler.log
          exit 1
      - name: Inspect exact read-only tool surface
        shell: bash
        run: |
          set -euo pipefail
          out=$(npx --yes @modelcontextprotocol/inspector@2.6.0 --cli \
            --transport http \
            --server-url http://127.0.0.1:8787/mcp \
            --header "Authorization: Bearer readonly-ci-key-abcdefghijklmnopqrstuvwxyz123456" \
            --method tools/list \
            --format json)
          printf '%s\n' "$out" > /tmp/tools.json
          jq -e '
            (.result.tools | map(.name) | sort) == ["nofax_get_request", "nofax_list_pending"]
            and
            (.result.tools | all(
              .annotations.readOnlyHint == true
              and .annotations.destructiveHint == false
              and .annotations.idempotentHint == true
              and .annotations.openWorldHint == false
            ))
          ' /tmp/tools.json >/dev/null
          jq '{tools: [.result.tools[] | {name, annotations}]}' /tmp/tools.json
      - name: Assert auth and removed routes
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/unauth -w '%{http_code}' http://127.0.0.1:8787/mcp)
          test "$code" = "401"
          code=$(curl -sS -o /tmp/telegram -w '%{http_code}' -X POST http://127.0.0.1:8787/telegram/webhook)
          test "$code" = "404"
          code=$(curl -sS -o /tmp/refine -w '%{http_code}' http://127.0.0.1:8787/r/anything)
          test "$code" = "404"
      - name: Stop local Worker
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/nofax-wrangler.pid ]; then
            kill "$(cat /tmp/nofax-wrangler.pid)" 2>/dev/null || true
          fi
