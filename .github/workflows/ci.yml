name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # GitHub's current Node 22 image ships npm 10.9.8, which hits an
      # Arborist edgesOut crash on this Worker lockfile. npm 11.6.0 is verified.
      - run: npm install --global npm@11.6.0
      - run: npm ci
      # Only production dependencies can ship in the Worker bundle; dev-tool
      # advisories do not fail this gate, but any production high/critical does.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
