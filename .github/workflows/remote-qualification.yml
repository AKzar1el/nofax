name: Remote MCP Qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Start local Worker with CI-only capabilities
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          NTFY_TOPIC=nofax_ci_nonsecret_topic
          NOFAX_REMOTE_KEY=nofax_ci_remote_key_0123456789abcdef0123456789abcdef
          EOF
          npx wrangler dev --local --port 8787 > /tmp/nofax-wrangler.log 2>&1 &
          echo $! > /tmp/nofax-wrangler.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/healthz > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          test "$(cat /tmp/health.json)" = '{"status":"ok"}'
      - name: Reject unauthenticated MCP
        run: |
          status=$(curl --silent --output /tmp/unauthorized.txt --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8787/mcp \
            -H 'content-type: application/json' \
            --data '{}')
          test "$status" = '401'
      - name: Discover exact tool surface with MCP Inspector header auth
        run: |
          npx -y @modelcontextprotocol/inspector@2.6.0 --cli \
            http://127.0.0.1:8787/mcp \
            --transport http \
            --method tools/list \
            --header 'Authorization: Bearer nofax_ci_remote_key_0123456789abcdef0123456789abcdef' \
            --format json > /tmp/tools-header.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parsed = JSON.parse(fs.readFileSync('/tmp/tools-header.json', 'utf8'));
          const names = parsed.result.tools.map((tool) => tool.name).sort();
          const expected = [
            'nofax_get_request',
            'nofax_list_pending',
            'nofax_notify',
            'nofax_request_approval',
            'nofax_request_choice',
            'nofax_request_refinement',
            'nofax_wait_for_response'
          ].sort();
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected tools: ${JSON.stringify(names)}`);
          }
          console.log(`Inspector discovered ${names.length}/7 expected tools`);
          NODE
      - name: Discover exact tool surface with capability URL
        run: |
          npx -y @modelcontextprotocol/inspector@2.6.0 --cli \
            http://127.0.0.1:8787/mcp/nofax_ci_remote_key_0123456789abcdef0123456789abcdef \
            --transport http \
            --method tools/list \
            --format json > /tmp/tools-url.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parsed = JSON.parse(fs.readFileSync('/tmp/tools-url.json', 'utf8'));
          if (parsed.result.tools.length !== 7) throw new Error('Capability URL did not expose seven tools');
          console.log('Capability URL discovered 7/7 expected tools');
          NODE
      - name: Stop local Worker
        if: always()
        shell: bash
        run: |
          if test -f /tmp/nofax-wrangler.pid; then kill "$(cat /tmp/nofax-wrangler.pid)" || true; fi
          rm -f .dev.vars
